# Class definition for audio format for module input/output pin object
# pin_form objects can be instantiated as:
#
# Object.Base.pin_format."1" {
#	type			"input"
#	rate			48000
#	sample_container_size	16
#	valid_bit_depth	16
#	interleaving_style	"interleaved"
# }
#

Class.Base."pin_format" {

	DefineAttribute."instance" {}

	DefineAttribute."index" {
		# Token set reference name
		token_ref	"sof_tkn_comp_pin_format.word"
	}

	DefineAttribute."pin_type" {
		type	"string"
		# Token set reference name
		token_ref	"sof_tkn_comp_pin_format.word"
		constraints {
			!valid_values [
				"sink"
				"source"
			]
			!tuple_values [
				1
				2
			]
		}
	}

	# sampling rate
	DefineAttribute."rate" {
		# Token set reference name
		token_ref	"sof_tkn_comp_pin_format.word"
	}

	# bit depth
	DefineAttribute."bit_depth" {
		# Token set reference name
		token_ref	"sof_tkn_comp_pin_format.word"
	}

	# valid bit depth
	DefineAttribute."valid_bit_depth" {
		# Token set reference name
		token_ref	"sof_tkn_comp_pin_format.word"
	}

	# channel count
	DefineAttribute."channels" {
		# Token set reference name
		token_ref	"sof_tkn_comp_pin_format.word"
		constraints {
			min 1
			max 8
		}
	}

	# channel map
	DefineAttribute."ch_map" {
		# Token set reference name
		token_ref	"sof_tkn_comp_pin_format.word"
	}

	# channel config
	DefineAttribute."ch_cfg" {
		# Token set reference name
		token_ref	"sof_tkn_comp_pin_format.word"
	}

	# interleaving style
	DefineAttribute."interleaving_style" {
		type	"string"
		# Token set reference name
		token_ref	"sof_tkn_comp_pin_format.word"
		constraints {
			!valid_values [
				"interleaved"
				"non-interleaved"
			]
			!tuple_values [
				0
				1
			]
		}
	}

	# format config
	DefineAttribute."fmt_cfg" {
		# Token set reference name
		token_ref	"sof_tkn_comp_pin_format.word"
	}

	#
	# input/output buffer size depending on pin type
	#
	DefineAttribute."buffer_size" {
		# Token set reference name and type
		token_ref	"sof_tkn_comp_pin_format.word"
	}

	# sample_type
	DefineAttribute."sample_type" {
		type string
		# Token set reference name
		token_ref	"sof_tkn_comp_pin_format.word"
		constraints {
			!valid_values [
				$SAMPLE_TYPE_MSB_INTEGER
				$SAMPLE_TYPE_LSB_INTEGER
				$SAMPLE_TYPE_SIGNED_INTEGER
				$SAMPLE_TYPE_UNSIGNED_INTEGER
				$SAMPLE_TYPE_FLOAT
			]
		}
	}

	attributes {
		!constructor [
			"pin_type"
			"index"
		]

		#
		# audio_format objects instantiated within the same alsaconf node must have unique
		# instance attribute values
		#
		unique	"instance"
	}

	rate		48000
	bit_depth		16
	valid_bit_depth	16
	channels		2
	interleaving_style	"interleaved"
	sample_type		$SAMPLE_TYPE_MSB_INTEGER
	ch_cfg	$CHANNEL_CONFIG_STEREO
	ch_map	$CHANNEL_MAP_STEREO

	# math expression for computing input/output fmt_cfg
	fmt_cfg	"$[($channels | ($valid_bit_depth * 256)) | ($sample_type * 65536)]"

	# math expression for computing input/put buffer sizes
	# for 11.025 22.05, 44.1, 88.2 and 176.4khz, we need to round it to ceiling value
	buffer_size "$[($channels * ($[($rate + 999)] / 1000)) * ($bit_depth / 8)]"
}
