Define {
	SSP0_PCM_NAME			"Port0"
	SSP0_PCM_ID			0
	MCLK 				24576000
}

# override defaults with platform-specific config
IncludeByKey.PLATFORM {
	"tgl"	"platform/intel/tgl.conf"
	"adl"	"platform/intel/tgl.conf"
	"mtl"	"platform/intel/mtl.conf"
	"lnl"	"platform/intel/lnl.conf"
}

Object.Dai.SSP [
	{
		id 		0
		dai_index	0
		direction	"duplex"
		name		NoCodec-0
		default_hw_conf_id	0
		sample_bits		32
		quirks			"lbm_mode"
		io_clk		$MCLK

		Object.Base.hw_config.1 {
			name	"SSP0"
			id	0
			bclk_freq	3072000
			tdm_slot_width	32
			# TODO: remove this. Needs alsaptlg change.
			Object.Base.link_config.1 {
				clock_source	1
			}
		}
	}
]

# Pipeline definitions consisting of small fragments of each pipeline in the order source->sink
# When needed, additional fragments can be simply inserted in the right position to expand the
# pipeline.
Pipelines [
	# Pipeline 1 is made up of 2 fragments
	# Fragment 1 in pipeline 1 contains just the host-copier
	{
		pipeline_id	1
		direction	playback
		dynamic_pipeline	1

		Object.Widget {
			host-copier.1 {
				# TODO: Add the audio format objects and make them common for the pipeline
				num_input_audio_formats 1
				num_output_audio_formats 1
				type	"aif_in"
				node_type $HDA_HOST_OUTPUT_CLASS
				stream_name 'SSP0 Playback'
				pcm_id 0
			}
		}
	}
	# Fragment 2 in pipeline 1 is an extension of fragment 1 and contains gain and mixin
	{
		pipeline_id	1
		Object.Widget {
			gain.1 {
				num_input_audio_formats 1
				num_output_audio_formats 1
				curve_type "windows_fade"
				Object.Control.mixer.1 {
					name 'Pre Mixer $SSP0_PCM_NAME Playback Volume'
				}
			}

			mixin.1 {}
		}
	}

	# Pipeline 2 is made up of 3 fragments
	# Fragment 1 in pipeline 2 contains just the mixout
	{
		pipeline_id	2
		direction	playback
		Object.Widget {
			mixout.1 {}
		}
	}
	# Fragment 2 in pipeline 2 contains gain and smart-amp
	{
		pipeline_id	2
		Object.Widget {
			gain.1 {
				num_input_audio_formats 1
				num_output_audio_formats 1

				curve_type "windows_fade"
				Object.Control.mixer.1 {
					name 'Post Mixer $SSP0_PCM_NAME Playback Volume'
				}
			}
			smart_amp.1 {
				num_input_audio_formats 1
				num_output_audio_formats 1

				Object.Base.input_pin_binding [
					{
						input_pin_binding_name	"gain.2.1"
					}
					{
						input_pin_binding_name	"dai-copier.SSP.NoCodec-0.capture"
					}
				]

				Object.Control.bytes."1" {
					name "Main Playback and $SSP0_PCM_NAME smart_amp_init"
				}
			}
		}
	}
	# Fragment 3 in pipeline 2 contains just the dai-copier
	{
		pipeline_id	2
		Object.Widget {
			dai-copier.1 {
				num_input_audio_formats 1
				num_output_audio_formats 1

				type dai_in
				dai_index 0
				dai_type "SSP"
				copier_type "SSP"
				stream_name "NoCodec-0"
				node_type $I2S_LINK_OUTPUT_CLASS
			}
		}
	}
]

# Top-level pipeline connections
ConnectPipelines [
	# Connect source pipeline 1 to sink pipeline 2 i.e mixin.1.1 -> mixout.2.1
	[ 1 2 ]
]

Object.PCM.pcm [
	{
		name	"$SSP0_PCM_NAME"
		id $SSP0_PCM_ID
		direction	"duplex"
		Object.Base.fe_dai.1 {
			name	"$SSP0_PCM_NAME"
		}

		Object.PCM.pcm_caps.1 {
			direction	"playback"
			name "SSP0 Playback"
			formats 'S16_LE,S24_LE,S32_LE'
		}

		Object.PCM.pcm_caps.2 {
			direction	"capture"
			name "SSP0 Capture"
			formats 'S16_LE,S24_LE,S32_LE'
		}
	}
]
