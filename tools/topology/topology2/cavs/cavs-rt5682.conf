Object.Base.manifest."sof_manifest" {
	Object.Base.data."SOF ABI" {
		bytes	"0x03,0x14,0x01"
	}
}
<searchdir:cavs>
<searchdir:include>
<searchdir:include/common>
<searchdir:include/components>
<searchdir:include/dais>
<searchdir:include/pipelines/cavs>

<vendor-token.conf>
<manifest.conf>
<tokens.conf>
<passthrough-playback.conf>
<passthrough-capture.conf>
<passthrough-be.conf>
<data.conf>
<pcm.conf>
<pcm_caps.conf>
<fe_dai.conf>
<ssp.conf>
<hw_config.conf>
<manifest.conf>
<route.conf>
<cavs/common_definitions.conf>
<copier.conf>
<pipeline.conf>

Object.Dai {
	SSP."0" {
		id 		0
		direction	"duplex"
		name		'SSP0-Codec'
		default_hw_conf_id	0
		sample_bits		32
		io_clk		24576000

		Object.Base.hw_config."SSP0" {
			id	0
			mclk_freq	24576000
			bclk_freq	3072000
			tdm_slot_width	32
		}
	}
}

Object.Pipeline {
	passthrough-be.1 {
		index	2
		format	s32le
		direction	playback
		Object.Widget.pipeline.1 {
			stream_name 'SSP0-Codec'
		}

		Object.Widget.copier.1 {
			dai_index 0
			dai_type "SSP"
			copier_type "SSP"
			stream_name "SSP0-Codec"
			node_type $I2S_LINK_OUTPUT_CLASS
		}
	}

	passthrough-playback.1 {
		index	1
		format	s32le
		Object.Widget.pipeline.1 {
			stream_name 'SSP0-Codec'
		}
		Object.Widget.copier.1 {
			stream_name 'Headset Playback'
		}
	}

	passthrough-capture.1 {
		index 	3
		format	s32le
		Object.Widget.pipeline.1 {
			stream_name 'SSP0-Codec'
		}
		Object.Widget.copier.1 {
			stream_name 'Headset Capture'
		}
	}

	passthrough-be.2 {
		index		4
		direction	capture
		format		s32le
		Object.Widget.pipeline.1 {
			stream_name 'SSP0-Codec'
		}

		Object.Widget.copier."1" {
			dai_index	0
			dai_type	"SSP"
			type		dai_out
			copier_type	"SSP"
			stream_name	"SSP0-Codec"
			node_type	$I2S_LINK_INPUT_CLASS
		}
	}
}

Object.PCM {
	pcm.1 {
		id 1
		name 'Headset'
		Object.Base.fe_dai.'Headset' {}
		Object.PCM.pcm_caps.playback {
			name 'Headset Playback'
			formats 'S32_LE,S24_LE,S16_LE'
		}
		Object.PCM.pcm_caps.capture {
			name 'Headset Capture'
			formats 'S32_LE,S24_LE,S16_LE'
		}
		direction duplex
	}
}

# top-level pipeline connections
Object.Base {
	route.1 {
		source 'copier.host.1.1'
		sink 'copier.SSP.2.1'
	}
	route.2 {
		sink 'copier.host.3.1'
		source 'copier.SSP.4.1'
	}
}
